<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>Upvotes</title>
        <style>
            :root {
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            html {
                scroll-padding-top: env(safe-area-inset-top, 0px);
            }
            *, *::before, *::after {
                box-sizing: inherit;
                border-radius: 0;
            }
            body {
                font-family: Helvetica, Arial, sans-serif;
                background-color: #0c0c0c;
                color: #ffffff;
                margin: 0;
                padding: 16px;
                line-height: 1.4;
            }
            div {
                background-color: #1a1a1a;
            }
            .clear {
                background-color: transparent;
            }
            [hidden] {
                display: none !important;
            }
            h1, h2, h3 {
                margin: 0;
            }
            h1 { font-size: 24px; }
            h2 { font-size: 20px; }
            h3 { font-size: 15px; }
            button, input, select, textarea {
                font-family: inherit;
                font-size: 14px;
                color: #ffffff;
                background-color: #0c0c0c;
                border: 1px solid #4d4d4d;
                border-radius: 0;
                margin: 0;
            }
            button {
                cursor: pointer;
                padding: 6px 14px;
            }
            button:hover {
                border-color: #ffffff;
            }
            button:disabled {
                cursor: default;
                opacity: 0.6;
            }
            input, select, textarea {
                padding: 8px 10px;
                width: 100%;
            }
            input[type="file"] {
                cursor: pointer;
            }
            input[type="file"]::file-selector-button {
                font-family: inherit;
                font-size: 14px;
                color: #ffffff;
                background-color: #1a1a1a;
                border: 1px solid #4d4d4d;
                border-radius: 0;
                padding: 4px 10px;
                margin-right: 10px;
                cursor: pointer;
            }
            input[type="file"]::file-selector-button:hover {
                border-color: #ffffff;
            }
            textarea {
                resize: vertical;
                min-height: 72px;
            }
            input::placeholder, textarea::placeholder {
                color: #8c8c8c;
            }
            :focus-visible {
                outline: 2px solid #ffffff;
                outline-offset: 2px;
            }
            .solid {
                background-color: #ffffff;
                color: #0c0c0c;
                border-color: #ffffff;
                font-weight: bold;
            }
            .solid:hover {
                background-color: #d9d9d9;
                border-color: #d9d9d9;
            }
            .on,
            button[aria-pressed="true"],
            button[aria-current="true"] {
                background-color: #ffffff;
                color: #0c0c0c;
                border-color: #ffffff;
            }
            .linklike {
                border: 0;
                background-color: transparent;
                padding: 0;
                color: #8c8c8c;
                font-size: inherit;
                text-decoration: underline;
            }
            .linklike:hover {
                color: #ffffff;
            }
            .muted {
                color: #8c8c8c;
            }
            .page {
                max-width: 960px;
                margin: 0 auto;
                background-color: transparent;
            }
            /* top bar */
            .topbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                padding: 8px 16px;
                margin-bottom: 8px;
            }
            .actions {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .account {
                position: relative;
            }
            .account-btn {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 3px 10px 3px 4px;
            }
            .menu {
                position: absolute;
                top: calc(100% + 4px);
                right: 0;
                width: 220px;
                border: 1px solid #4d4d4d;
                z-index: 5;
            }
            .menu-head {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 12px;
                border-bottom: 1px solid #333333;
            }
            .menu button {
                display: block;
                width: 100%;
                text-align: left;
                border: 0;
                border-bottom: 1px solid #333333;
                padding: 10px 12px;
                background-color: #1a1a1a;
            }
            .menu button:last-child {
                border-bottom: 0;
            }
            .menu button:hover {
                background-color: #ffffff;
                color: #0c0c0c;
            }
            .notice {
                min-height: 0;
                padding: 0 16px;
                margin-bottom: 8px;
                font-size: 14px;
            }
            .notice:not(:empty) {
                padding: 8px 16px;
                border: 1px solid #4d4d4d;
            }
            /* layout */
            .layout {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 260px;
                gap: 8px;
                align-items: start;
                background-color: transparent;
            }
            .feed-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                padding: 12px 16px;
                margin-bottom: 8px;
            }
            .feed-head p {
                margin: 2px 0 0;
                font-size: 13px;
                color: #8c8c8c;
                background-color: transparent;
            }
            .tabs {
                display: flex;
                background-color: transparent;
                flex: 0 0 auto;
            }
            .tabs button + button {
                border-left: 0;
            }
            /* posts */
            .post {
                display: flex;
                margin-bottom: 8px;
            }
            .vote {
                flex: 0 0 64px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 4px;
                padding: 12px 0;
            }
            .vote button {
                width: 36px;
                height: 32px;
                padding: 0;
                line-height: 1;
            }
            .count {
                font-weight: bold;
                font-size: 15px;
                background-color: transparent;
                font-variant-numeric: tabular-nums;
            }
            .thumb {
                flex: 0 0 auto;
                padding: 12px 12px 12px 0;
                display: flex;
                align-items: center;
            }
            .thumb a {
                display: block;
                background-color: transparent;
            }
            .thumb img {
                display: block;
                width: 96px;
                height: 96px;
                object-fit: cover;
                border: 1px solid #4d4d4d;
                background-color: #292929;
            }
            .thumb a:hover img {
                border-color: #ffffff;
            }
            .body {
                flex: 1;
                min-width: 0;
                padding: 12px 16px 12px 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            .title {
                font-size: 17px;
                font-weight: bold;
                margin: 0 0 4px;
                overflow-wrap: anywhere;
                background-color: transparent;
            }
            .title a {
                color: #ffffff;
                text-decoration: none;
            }
            .title a:hover {
                text-decoration: underline;
            }
            .meta {
                font-size: 13px;
                color: #8c8c8c;
                background-color: transparent;
            }
            .mod-delete {
                color: #ff8c8c;
            }
            .mod-delete:hover {
                color: #ffffff;
            }
            .danger {
                color: #ff8c8c;
                border-color: #ff8c8c;
            }
            .danger:hover {
                background-color: #ff8c8c;
                color: #0c0c0c;
                border-color: #ff8c8c;
            }
            .empty {
                padding: 24px 16px;
                color: #8c8c8c;
            }
            /* sidebar */
            .side {
                position: sticky;
                top: 8px;
            }
            .side-block {
                margin-bottom: 8px;
            }
            .side-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                padding: 12px 16px;
                border-bottom: 1px solid #333333;
            }
            .side-all {
                display: block;
                width: 100%;
                text-align: left;
                border: 0;
                border-bottom: 1px solid #333333;
                padding: 10px 16px;
                background-color: #1a1a1a;
            }
            .side-all[aria-current="true"] {
                background-color: #ffffff;
            }
            .sublist {
                max-height: 480px;
                overflow-y: auto;
            }
            .sub {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 8px 16px;
                border-bottom: 1px solid #333333;
            }
            .sub:last-child {
                border-bottom: 0;
            }
            .sub-main {
                flex: 1;
                min-width: 0;
                text-align: left;
                border: 0;
                padding: 0;
                background-color: transparent;
                display: block;
            }
            .sub-main[aria-current="true"] .sub-name {
                text-decoration: underline;
            }
            .sub-name {
                display: block;
                font-weight: bold;
                font-size: 14px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                background-color: transparent;
            }
            .sub-members {
                display: block;
                font-size: 12px;
                color: #8c8c8c;
                background-color: transparent;
            }
            .sub .join {
                padding: 4px 10px;
                font-size: 13px;
            }
            .post-avatar { vertical-align: middle; margin: 0 3px 0 5px; }
            .avatar {
                display: block;
                flex: 0 0 auto;
                border: 1px solid #4d4d4d;
            }
            /* dialogs */
            .overlay {
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                left: 0;
                z-index: 10;
                display: flex;
                align-items: flex-start;
                justify-content: center;
                padding: calc(env(safe-area-inset-top, 0px) + 40px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
                overflow-y: auto;
                background-color: rgba(0, 0, 0, 0.8);
            }
            .dialog {
                width: 100%;
                max-width: 480px;
                border: 1px solid #4d4d4d;
                padding: 20px;
            }
            .dialog h2 {
                margin-bottom: 16px;
            }
            .field {
                margin-bottom: 14px;
                background-color: transparent;
            }
            .field label {
                display: block;
                font-size: 13px;
                margin-bottom: 4px;
                color: #8c8c8c;
            }
            .preview {
                margin-top: 8px;
                background-color: transparent;
                font-size: 13px;
            }
            .preview img {
                display: block;
                max-width: 100%;
                max-height: 220px;
                border: 1px solid #4d4d4d;
                margin-bottom: 6px;
            }
            .error {
                min-height: 18px;
                font-size: 13px;
                margin-bottom: 8px;
                background-color: transparent;
            }
            .dialog-actions {
                display: flex;
                justify-content: flex-end;
                gap: 8px;
                background-color: transparent;
            }
            @media (max-width: 720px) {
                body { padding: 8px; }
                .layout { grid-template-columns: minmax(0, 1fr); }
                .side { position: static; order: -1; }
                .sublist { max-height: 200px; }
                .thumb img { width: 72px; height: 72px; }
                .vote { flex-basis: 52px; }
                .feed-head { flex-wrap: wrap; }
            }
        </style>
    </head>
    <body>
        <div class="page clear">
            <div class="topbar">
                <button id="open-post" type="button" class="solid" disabled>Post</button>
                <div class="account clear" id="account">
                    <button id="account-btn" type="button" class="account-btn" aria-haspopup="true" aria-expanded="false">Log in / Sign up ▾</button>
                    <div id="menu" class="menu" hidden></div>
                </div>
            </div>
            <div id="notice" class="notice clear" role="status" aria-live="polite"></div>
            <div class="layout">
                <main class="clear">
                    <div class="feed-head">
                        <div class="clear">
                            <h2 id="feed-title">All posts</h2>
                            <p id="feed-desc"></p>
                        </div>
                        <div class="actions clear">
                            <button id="delete-sub" type="button" class="danger" hidden>Delete sub</button>
                            <div class="tabs" role="group" aria-label="Sort posts">
                                <button id="sort-top" type="button" aria-pressed="true">Top</button>
                                <button id="sort-new" type="button" aria-pressed="false">New</button>
                            </div>
                        </div>
                    </div>
                    <div id="list" class="clear"></div>
                </main>
                <aside class="side clear">
                    <div class="side-block">
                        <div class="side-head">
                            <h3>Subs</h3>
                            <button id="open-sub" type="button" disabled>Make a sub</button>
                        </div>
                        <button id="view-all" type="button" class="side-all">All posts</button>
                        <div id="sublist" class="sublist"></div>
                    </div>
                </aside>
            </div>
        </div>
        <div id="dlg-post" class="overlay" hidden>
            <form class="dialog" role="dialog" aria-modal="true" aria-labelledby="post-h" autocomplete="off" id="form-post">
                <h2 id="post-h">New Post</h2>
                <div class="field">
                    <label for="p-sub">Sub</label>
                    <select id="p-sub"></select>
                </div>
                <div class="field">
                    <label for="p-title">Title</label>
                    <input type="text" id="p-title" maxlength="200" required>
                </div>
                <div class="field">
                    <label for="p-url">Link (optional)</label>
                    <input id="p-url" type="url">
                </div>
                <div class="field">
                    <label for="p-file">Image (optional, JPG, PNG, GIF or WebP, up to 5 MB)</label>
                    <input id="p-file" type="file" accept="image/jpeg,image/png,image/gif,image/webp">
                    <div id="p-preview" class="preview" hidden>
                        <img id="p-preview-img" alt="Preview of the selected image">
                        <button type="button" id="p-clear" class="linklike">Remove image</button>
                    </div>
                </div>
                <div class="error" id="p-err" role="alert"></div>
                <div class="dialog-actions">
                    <button type="button" data-close="dlg-post">Cancel</button>
                    <button type="submit" class="solid" id="p-submit">Post</button>
                </div>
            </form>
        </div>
        <div id="dlg-sub" class="overlay" hidden>
            <form class="dialog" role="dialog" aria-modal="true" aria-labelledby="sub-h" autocomplete="off" id="form-sub">
                <h2 id="sub-h">New Sub</h2>
                <div class="field">
                    <label for="s-name">Name (3-21 characters, numbers or underscores)</label>
                    <input type="text" id="s-name" maxlength="21" required placeholder="A good name!">
                </div>
                <div class="field">
                    <label for="s-desc">Description</label>
                    <textarea id="s-desc" maxlength="200"></textarea>
                </div>
                <div class="error" id="s-err" role="alert"></div>
                <div class="dialog-actions">
                    <button type="button" data-close="dlg-sub">Cancel</button>
                    <button type="submit" class="solid">Create</button>
                </div>
            </form>
        </div>
        <div id="dlg-account" class="overlay" hidden>
            <form class="dialog" role="dialog" aria-modal="true" aria-labelledby="account-h" autocomplete="on" id="form-account">
                <h2 id="account-h">Create your Upvotes account</h2>
                <div class="field"><label for="a-email">Email</label><input id="a-email" type="email" autocomplete="email" required></div>
                <div class="field"><label for="a-username">Username (3–21 letters, numbers or underscores)</label><input id="a-username" type="text" minlength="3" maxlength="21" pattern="[A-Za-z0-9_]{3,21}" autocomplete="username" required></div>
                <div class="field"><label for="a-password">Password (at least 8 characters)</label><input id="a-password" type="password" minlength="8" autocomplete="new-password" required></div>
                <div class="field"><label for="a-avatar">Profile picture (optional, JPG/PNG/GIF/WebP, up to 2 MB)</label><input id="a-avatar" type="file" accept="image/jpeg,image/png,image/gif,image/webp"></div>
                <div class="error" id="a-err" role="alert"></div>
                <div class="dialog-actions"><button type="button" data-close="dlg-account">Cancel</button><button type="submit" class="solid" id="a-submit">Create account</button></div>
                <p class="muted">Already registered? <button type="button" class="linklike" id="a-switch-login">Log in</button></p>
            </form>
        </div>
        <div id="dlg-login" class="overlay" hidden>
            <form class="dialog" role="dialog" aria-modal="true" aria-labelledby="login-h" autocomplete="on" id="form-login">
                <h2 id="login-h">Log in to Upvotes</h2>
                <div class="field"><label for="l-email">Email</label><input id="l-email" type="email" autocomplete="username" required></div>
                <div class="field"><label for="l-password">Password</label><input id="l-password" type="password" autocomplete="current-password" required></div>
                <div class="error" id="l-err" role="alert"></div>
                <div class="dialog-actions"><button type="button" data-close="dlg-login">Cancel</button><button type="submit" class="solid" id="l-submit">Log in</button></div>
                <p class="muted">New here? <button type="button" class="linklike" id="l-switch-signup">Create an account</button></p>
            </form>
        </div>
        <div id="dlg-username" class="overlay" hidden>
            <form class="dialog" role="dialog" aria-modal="true" aria-labelledby="username-h" autocomplete="off" id="form-username">
                <h2 id="username-h">Change username</h2>
                <p class="muted">Your username must be 3–21 letters, numbers or underscores.</p>
                <div class="field"><label for="new-username">New username</label><input id="new-username" type="text" minlength="3" maxlength="21" pattern="[A-Za-z0-9_]{3,21}" autocomplete="username" required></div>
                <div class="error" id="username-err" role="alert"></div>
                <div class="dialog-actions"><button type="button" data-close="dlg-username">Cancel</button><button type="submit" class="solid" id="username-submit">Save username</button></div>
            </form>
        </div>
        <input id="avatar-file" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script>
            var MIN = 60 * 1000, HOUR = 60 * MIN, DAY = 24 * HOUR;
            var SUPABASE_URL = 'https://xvrmatpvosgqbwxbqbtd.supabase.co';
            var SUPABASE_ANON_KEY = 'sb_publishable_HAHT3mz4AkFgofeF4o-pSA_vmGfb-iP';
            var IMAGE_BUCKET = 'post-images';
            var MAX_IMAGE_BYTES = 5 * 1024 * 1024;
            var IMAGE_TYPES = {
                'image/jpeg': 'jpg',
                'image/png': 'png',
                'image/gif': 'gif',
                'image/webp': 'webp'
            };
            var VISITOR_KEY = 'upvotes-visitor-id';
            var visitorId = localStorage.getItem(VISITOR_KEY);
            if (!visitorId) {
                visitorId = crypto.randomUUID();
                localStorage.setItem(VISITOR_KEY, visitorId);
            }
            var ME = 'visitor_' + visitorId.slice(0, 8);
            var supabaseClient = null;
            var state = {
                view: 'all',        // 'all' | 'joined' | 'mine' | 's:<name>'
                sort: 'top',
                isModerator: false,
                moderatorEmail: '',
                voted: {},
                subs: [],
                posts: []
            };
            var order = [];
            var lastFocus = null;
            var noticeTimer = null;
            var previewUrl = null;
            /* ---------- helpers ---------- */
            function el(tag, cls, text) {
                var n = document.createElement(tag);
                if (cls) n.className = cls;
                if (text !== undefined) n.textContent = text;
                return n;
            }
            function usernameNode(username, prefix, isCurrentUser) {
                var name = String(username || '');
                var n = el('span', '', (prefix || '') + name);
                if (isCurrentUser) n.style.color = '#F2CD5D';
                return n;
            }
            function ago(ts) {
                var d = Date.now() - ts;
                if (d < MIN) return 'just now';
                if (d < HOUR) return Math.floor(d / MIN) + ' min ago';
                if (d < DAY) return Math.floor(d / HOUR) + ' hr ago';
                return Math.floor(d / DAY) + ' d ago';
            }
            function host(url) {
                try { return new URL(url).hostname.replace(/^www\./i, ''); } catch (e) { return ''; }
            }
            function normalizeUrl(u) {
                u = (u || '').trim();
                if (!u) return '';
                if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
                try { new URL(u); return u; } catch (e) { return ''; }
            }
            function members(n) {
                return (n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(n)) + ' members';
            }
            function hash(str) {
                var h = 0;
                for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
                return Math.abs(h);
            }
            function placeholder(seed, w, h) {
                var shades = ['#222222', '#292929', '#303030', '#363636'];
                var fill = shades[hash(seed) % shades.length];
                var svg = '<svg xmlns="http\://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '">' +
                    '<rect width="' + w + '" height="' + h + '" fill="' + fill + '"/>' +
                    '<path d="M0 0L' + w + ' ' + h + 'M' + w + ' 0L0 ' + h + '" stroke="#555555" stroke-width="2" fill="none"/>' +
                    '</svg>';
                return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
            }
            function img(seed, size, cls) {
                var i = document.createElement('img');
                i.src = placeholder(seed, size, size);
                i.width = size;
                i.height = size;
                i.alt = '';
                if (cls) i.className = cls;
                return i;
            }
            function imageUrl(path) {
                return supabaseClient.storage.from(IMAGE_BUCKET).getPublicUrl(path).data.publicUrl;
            }
            function checkImage(file) {
                if (!IMAGE_TYPES[file.type]) return 'Images must be JPG, PNG, GIF or WebP.';
                if (file.size > MAX_IMAGE_BYTES) return 'That image is over 5 MB. Pick a smaller one.';
                return '';
            }
            function avatarUrl(path) {
                if (!path || !supabaseClient) return '';
                return supabaseClient.storage.from(ACCOUNT_AVATAR_BUCKET).getPublicUrl(path).data.publicUrl;
            }
            function accountAvatar(seed, path, size, cls) {
                var node = img(seed, size, cls || 'avatar');
                var url = avatarUrl(path);
                if (url) { node.src = url; node.onerror = function () { node.onerror = null; node.src = placeholder(seed, size, size); }; }
                return node;
            }
            async function loadProfile(user) {
                if (!user) { currentProfile = null; state.profile = null; return; }
                var result = await supabaseClient.from('profiles').select('id,username,avatar_path').eq('id', user.id).maybeSingle();
                if (result.error) throw result.error;
                if (!result.data) {
                    var username = (user.user_metadata && user.user_metadata.username) || ('user_' + user.id.slice(0, 8));
                    var created = await supabaseClient.from('profiles').insert({ id: user.id, username: username }).select('id,username,avatar_path').single();
                    if (created.error) {
                        if (created.error.code === '23505') throw new Error('That username is taken. Please choose another one.');
                        throw created.error;
                    }
                    currentProfile = created.data;
                } else currentProfile = result.data;
                state.profile = currentProfile;
                ME = currentProfile.username;
            }

            });
            /* post dialog */
            document.getElementById('open-post').addEventListener('click', function () {
                var sel = document.getElementById('p-sub');
                sel.textContent = '';
                var def = state.view.indexOf('s:') === 0 ? state.view.slice(2) : null;
                if (!def) {
                    var j = state.subs.filter(function (s) { return s.joined; })[0];
                    def = j ? j.name : (state.subs[0] ? state.subs[0].name : null);
                }
                state.subs.forEach(function (s) {
                    var o = document.createElement('option');
                    o.value = s.name;
                    o.textContent = 's/' + s.name;
                    if (s.name === def) o.selected = true;
                    sel.appendChild(o);
                });
                clearImage();
                document.getElementById('p-err').textContent = '';
                openDialog('dlg-post', 'p-title');
            });
            document.getElementById('form-post').addEventListener('submit', async function (e) {
                e.preventDefault();
                var title = document.getElementById('p-title').value.trim();
                var rawUrl = document.getElementById('p-url').value;
                var url = normalizeUrl(rawUrl);
                var err = document.getElementById('p-err');
                if (!title) { err.textContent = 'Add a title.'; return; }
                if (rawUrl.trim() && !url) { err.textContent = 'That link is not a valid URL.'; return; }
                var sub = document.getElementById('p-sub').value;
                var selectedSub = getSub(sub);
                if (!selectedSub) { err.textContent = 'Pick a sub.'; return; }
                var file = document.getElementById('p-file').files[0] || null;
                if (file) {
                    var problem = checkImage(file);
                    if (problem) { err.textContent = problem; return; }
                }
                var submit = document.getElementById('p-submit');
                submit.disabled = true;
                err.textContent = '';
                var uploadedPath = null;
                try {
                    if (file) {
                        submit.textContent = 'Uploading...';
                        var path = visitorId + '/' + crypto.randomUUID() + '.' + IMAGE_TYPES[file.type];
                        var up = await supabaseClient.storage.from(IMAGE_BUCKET).upload(path, file, {
                            contentType: file.type,
                            cacheControl: '31536000',
                            upsert: false
                        });
                        if (up.error) throw up.error;
                        uploadedPath = path;
                    }
                    submit.textContent = 'Posting...';
                    var result = await supabaseClient.from('posts').insert({
                        sub_id: selectedSub.id,
                        author_id: visitorId,
                        author_name: ME,
                        title: title,
                        url: url || null,
                        has_image: !!uploadedPath,
                        image_path: uploadedPath
                    });
                    if (result.error) throw result.error;
                    uploadedPath = null; // the post owns the file now
                    await refreshData();
                    document.getElementById('p-title').value = '';
                    document.getElementById('p-url').value = '';
                    clearImage();
                    closeDialog('dlg-post');
                    state.view = 's:' + sub;
                    renderAll();
                    notify('Posted in s/' + sub + '.');
                } catch (error) {
                    err.textContent = error.message || String(error);
                    console.error('Could not create post:', error);
                    if (uploadedPath) {
                        // Visitors can't delete from storage, so this may be a no-op; it only helps if allowed.
                        supabaseClient.storage.from(IMAGE_BUCKET).remove([uploadedPath]).catch(function () {});
                    }
                } finally {
                    submit.textContent = 'Post';
                    submit.disabled = false;
                }
            });
            /* sub dialog */
            document.getElementById('open-sub').addEventListener('click', function () {
                document.getElementById('s-err').textContent = '';
                openDialog('dlg-sub', 's-name');
            });
            document.getElementById('form-sub').addEventListener('submit', async function (e) {
                e.preventDefault();
                var name = document.getElementById('s-name').value.trim().replace(/^s\//i, '').toLowerCase();
                var desc = document.getElementById('s-desc').value.trim();
                var err = document.getElementById('s-err');
                if (!/^[a-z0-9_]{3,21}$/.test(name)) { err.textContent = 'Use 3 to 21 letters, numbers or underscores.'; return; }
                if (getSub(name)) { err.textContent = 's/' + name + ' already exists. Pick another name.'; return; }
                var submit = this.querySelector('button[type="submit"]');
                submit.disabled = true;
                err.textContent = '';
                try {
                    var result = await supabaseClient.rpc('create_sub', {
                        p_name: name,
                        p_description: desc,
                        p_visitor_id: visitorId
                    });
                    if (result.error) throw result.error;
                    await refreshData();
                    document.getElementById('s-name').value = '';
                    document.getElementById('s-desc').value = '';
                    closeDialog('dlg-sub');
                    state.view = 's:' + name;
                    renderAll();
                    notify('Made s/' + name + ' and joined it.');
                } catch (error) {
                    err.textContent = error.code === '23505'
                        ? 's/' + name + ' already exists. Pick another name.'
                        : (error.message || String(error));
                    console.error('Could not create sub:', error);
                } finally {
                    submit.disabled = false;
                }
            });
            /* ---------- controls ---------- */
            document.getElementById('sort-top').addEventListener('click', function () { state.sort = 'top'; sortOrder(); renderAll(); });
            document.getElementById('sort-new').addEventListener('click', function () { state.sort = 'new'; sortOrder(); renderAll(); });
            document.getElementById('view-all').addEventListener('click', function () { setView('all'); });
            document.getElementById('delete-sub').addEventListener('click', function () {
                var sub = state.view.indexOf('s:') === 0 ? getSub(state.view.slice(2)) : null;
                if (!sub) return;
                var count = state.posts.filter(function (p) { return p.subId === sub.id; }).length;
                var msg = 'Delete s/' + sub.name + ' and its ' + count + ' post' + (count === 1 ? '' : 's') + '? This cannot be undone.';
                if (window.confirm(msg)) deleteSub(sub, this);
            });
            async function start() {
                if (SUPABASE_URL.indexOf('YOUR_PROJECT_ID') !== -1 ||
                    SUPABASE_ANON_KEY.indexOf('YOUR_SUPABASE_') === 0) {
                    renderAll();
                    notify('Add your Supabase project URL and publishable/anon key in index.html.');
                    return;
                }
                if (!window.supabase) {
                    renderAll();
                    notify('Could not load the Supabase client. Check your internet connection and reload.');
                    return;
                }
                try {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    var sessionResult = await supabaseClient.auth.getSession();
                    if (sessionResult.error) throw sessionResult.error;
                    await applyUserSession(sessionResult.data.session);
                    supabaseClient.auth.onAuthStateChange(function (event, session) {
                        Promise.resolve().then(async function () {
                            if (event === 'SIGNED_OUT') {
                                currentUser = null; currentProfile = null; state.currentUser = null; state.profile = null;
                                visitorId = visitorIdForGuest(); ME = 'visitor_' + visitorId.slice(0, 8);
                                setModeratorSession(null); await refreshData(); renderAll();
                            } else if (session && session.user && (!currentUser || currentUser.id !== session.user.id)) {
                                await applyUserSession(session);
                            } else { setModeratorSession(session); renderAll(); }
                        }).catch(showError);
                    });
                    document.getElementById('open-post').disabled = false;
                    document.getElementById('open-sub').disabled = false;
                    renderAll();
                    supabaseClient.channel('public-feed')
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, refreshRemoteData)
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'subs' }, refreshRemoteData)
                        .subscribe(function (status) {
                            if (status === 'CHANNEL_ERROR') {
                                notify('Live updates are unavailable. Reload the page to refresh.');
                            }
                        });
                } catch (error) {
                    renderAll();
                    showError(error);
                }
            }
            function refreshRemoteData() {
                refreshData().then(renderAll).catch(showError);
            }
            window.addEventListener('load', start);
        </script>
    </body>
</html>
